<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asistente de Cobertura Médica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 700px;
      background: #1a73e8;
      color: white;
      padding: 20px 24px;
      border-radius: 12px 12px 0 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p { font-size: 0.85rem; opacity: 0.85; }

    #selector-paciente {
      width: 100%;
      max-width: 700px;
      background: #e8f0fe;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 1px solid #c5d4f5;
      border-right: 1px solid #c5d4f5;
    }

    #selector-paciente label {
      font-size: 0.85rem;
      color: #333;
      white-space: nowrap;
    }

    #selector-paciente select {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #c5d4f5;
      font-size: 0.85rem;
      background: white;
      cursor: pointer;
    }

    #chat-box {
      width: 100%;
      max-width: 700px;
      background: white;
      height: 460px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 1px solid #dde3ec;
      border-right: 1px solid #dde3ec;
    }

    .mensaje {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .mensaje.usuario { align-self: flex-end; align-items: flex-end; }
    .mensaje.agente { align-self: flex-start; align-items: flex-start; }

    .burbuja {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .usuario .burbuja {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .agente .burbuja {
      background: #f1f3f4;
      color: #202124;
      border-bottom-left-radius: 4px;
    }

    .nombre-remitente {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .escribiendo .burbuja {
      color: #888;
      font-style: italic;
    }

    #input-area {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      border: 1px solid #dde3ec;
      border-top: 2px solid #e8f0fe;
      border-radius: 0 0 12px 12px;
    }

    #input-mensaje {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid #dde3ec;
      font-size: 0.9rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }

    #input-mensaje:focus { border-color: #1a73e8; }

    #btn-enviar {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    #btn-enviar:hover { background: #1558b0; }
    #btn-enviar:disabled { background: #a8c4f0; cursor: not-allowed; }

    .mensaje-bienvenida {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Asistente de Cobertura Médica</h1>
    <p>Consulta tu copago y encuentra el hospital ideal antes de atenderte</p>
  </header>

  <div id="selector-paciente">
    <label>Paciente:</label>
    <select id="select-paciente">
      <option value="PAC-001">Carlos Mendoza — Plan Premium</option>
      <option value="PAC-002">María Torres — Plan Medio</option>
      <option value="PAC-003">Juan Pérez — Plan Básico</option>
      <option value="PAC-004">Ana Jiménez — Póliza vencida</option>
      <option value="PAC-005">Roberto Salinas — Plan Medio</option>
    </select>
  </div>

  <div id="chat-box">
    <p class="mensaje-bienvenida">Describe tu síntoma o consulta para comenzar</p>
  </div>

  <div id="input-area">
    <textarea
      id="input-mensaje"
      rows="1"
      placeholder="Ej: Tengo dolor de cabeza fuerte desde ayer..."
    ></textarea>
    <button id="btn-enviar">Enviar</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const inputMensaje = document.getElementById('input-mensaje');
    const btnEnviar = document.getElementById('btn-enviar');
    const selectPaciente = document.getElementById('select-paciente');

    let historial = [];

    selectPaciente.addEventListener('change', () => {
      historial = [];
      chatBox.innerHTML = '<p class="mensaje-bienvenida">Describe tu síntoma o consulta para comenzar</p>';
    });

    function agregarMensaje(texto, tipo) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('mensaje', tipo);

      const nombre = document.createElement('span');
      nombre.classList.add('nombre-remitente');
      nombre.textContent = tipo === 'usuario' ? 'Tú' : 'Asistente';

      const burbuja = document.createElement('div');
      burbuja.classList.add('burbuja');
      burbuja.innerHTML = texto
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^\d+\.\s(.+)/gm, '<p style="margin:4px 0">$&</p>')
        .replace(/\n/g, '<br>');

      wrapper.appendChild(nombre);
      wrapper.appendChild(burbuja);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;

      return burbuja;
    }

    function mostrarEscribiendo() {
      const wrapper = document.createElement('div');
      wrapper.classList.add('mensaje', 'agente', 'escribiendo');
      wrapper.id = 'escribiendo';

      const burbuja = document.createElement('div');
      burbuja.classList.add('burbuja');
      burbuja.textContent = 'Consultando tu cobertura...';

      wrapper.appendChild(burbuja);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function quitarEscribiendo() {
      const el = document.getElementById('escribiendo');
      if (el) el.remove();
    }

    async function enviarMensaje() {
      const texto = inputMensaje.value.trim();
      if (!texto) return;

      const pacienteId = selectPaciente.value;

      agregarMensaje(texto, 'usuario');
      historial.push({ role: 'user', content: texto });

      inputMensaje.value = '';
      btnEnviar.disabled = true;
      mostrarEscribiendo();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mensaje: texto,
            paciente_id: pacienteId,
            historial: historial.slice(0, -1)
          })
        });

        const data = await res.json();
        quitarEscribiendo();

        agregarMensaje(data.respuesta, 'agente');
        historial.push({ role: 'assistant', content: data.respuesta });

      } catch (error) {
        quitarEscribiendo();
        agregarMensaje('Ocurrió un error al consultar. Intenta nuevamente.', 'agente');
      }

      btnEnviar.disabled = false;
      inputMensaje.focus();
    }

    btnEnviar.addEventListener('click', enviarMensaje);

    inputMensaje.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarMensaje();
      }
    });
  </script>

</body>
</html>
