<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asistente de Cobertura Médica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* LOGIN */
    #pantalla-login {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #pantalla-login h2 {
      font-size: 1.3rem;
      color: #1a73e8;
      text-align: center;
    }

    #pantalla-login p {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      margin-top: -12px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo label {
      font-size: 0.82rem;
      color: #444;
      font-weight: 600;
    }

    .campo input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #dde3ec;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    .campo input:focus { border-color: #1a73e8; }

    #btn-login {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #btn-login:hover { background: #1558b0; }
    #btn-login:disabled { background: #a8c4f0; cursor: not-allowed; }

    #error-login {
      font-size: 0.82rem;
      color: #d93025;
      text-align: center;
      min-height: 18px;
    }

    /* CHAT */
    #pantalla-chat {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    header {
      width: 100%;
      max-width: 700px;
      background: #1a73e8;
      color: white;
      padding: 16px 24px;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header p { font-size: 0.8rem; opacity: 0.85; }

    #btn-logout {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #btn-logout:hover { background: rgba(255,255,255,0.35); }

    #banner-bienvenida {
      width: 100%;
      max-width: 700px;
      background: #e8f0fe;
      border-left: 1px solid #c5d4f5;
      border-right: 1px solid #c5d4f5;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    #banner-bienvenida .info-paciente {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #banner-bienvenida .nombre {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a3a6b;
    }

    #banner-bienvenida .detalle {
      font-size: 0.8rem;
      color: #555;
    }

    .badge-plan {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-plan.premium { background: #ffd700; color: #5a4000; }
    .badge-plan.medio { background: #c8e6c9; color: #1b5e20; }
    .badge-plan.basico { background: #e0e0e0; color: #424242; }

    .estado-poliza {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .estado-poliza.vigente { background: #e6f4ea; color: #1e7e34; }
    .estado-poliza.vencida { background: #fce8e6; color: #c5221f; }

    #chat-box {
      width: 100%;
      max-width: 700px;
      background: white;
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 1px solid #dde3ec;
      border-right: 1px solid #dde3ec;
    }

    .mensaje {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .mensaje.usuario { align-self: flex-end; align-items: flex-end; }
    .mensaje.agente { align-self: flex-start; align-items: flex-start; }

    .burbuja {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .usuario .burbuja {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .agente .burbuja {
      background: #f1f3f4;
      color: #202124;
      border-bottom-left-radius: 4px;
    }

    .nombre-remitente {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .escribiendo .burbuja {
      color: #888;
      font-style: italic;
    }

    #contador-mensajes {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 4px 20px;
      border-left: 1px solid #dde3ec;
      border-right: 1px solid #dde3ec;
      border-top: 1px solid #f0f0f0;
    }

    #contador-mensajes span {
      font-size: 0.75rem;
      color: #aaa;
    }

    #contador-mensajes span.advertencia { color: #f4a020; font-weight: 600; }

    #input-area {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      border: 1px solid #dde3ec;
      border-top: 2px solid #e8f0fe;
      border-radius: 0 0 12px 12px;
    }

    #input-mensaje {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid #dde3ec;
      font-size: 0.9rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }

    #input-mensaje:focus { border-color: #1a73e8; }

    #btn-enviar {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    #btn-enviar:hover { background: #1558b0; }
    #btn-enviar:disabled { background: #a8c4f0; cursor: not-allowed; }

    .mensaje-bienvenida-chat {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA LOGIN -->
  <div id="pantalla-login">
    <h2>Asistente de Cobertura Médica</h2>
    <p>Ingresa tus credenciales para consultar tu cobertura</p>

    <div class="campo">
      <label>Usuario</label>
      <input type="text" id="input-usuario" placeholder="Ej: carlos.mendoza" />
    </div>

    <div class="campo">
      <label>Contraseña</label>
      <input type="password" id="input-password" placeholder="Tu contraseña" />
    </div>

    <span id="error-login"></span>

    <button id="btn-login">Ingresar</button>
  </div>

  <!-- PANTALLA CHAT -->
  <div id="pantalla-chat">

    <header>
      <div>
        <h1>Asistente de Cobertura Médica</h1>
        <p>Consulta tu copago y encuentra el hospital ideal</p>
      </div>
      <button id="btn-logout">Cerrar sesión</button>
    </header>

    <div id="banner-bienvenida">
      <div class="info-paciente">
        <span class="nombre" id="nombre-paciente"></span>
        <span class="detalle" id="detalle-plan"></span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span class="badge-plan" id="badge-plan"></span>
        <span class="estado-poliza" id="estado-poliza"></span>
      </div>
    </div>

    <div id="chat-box">
      <p class="mensaje-bienvenida-chat" id="msg-bienvenida"></p>
    </div>

    <div id="contador-mensajes">
      <span id="texto-contador">0 / 14 preguntas usadas</span>
    </div>

    <div id="input-area">
      <textarea
        id="input-mensaje"
        rows="1"
        placeholder="Ej: Tengo dolor de cabeza fuerte desde ayer..."
      ></textarea>
      <button id="btn-enviar">Enviar</button>
    </div>

  </div>

  <script>
    // Estado de sesión
    let sesion = null;
    let historial = [];
    let contadorPreguntas = 0;
    const LIMITE_PREGUNTAS = 14;

    // Elementos
    const pantalla_login = document.getElementById('pantalla-login');
    const pantalla_chat = document.getElementById('pantalla-chat');
    const inputUsuario = document.getElementById('input-usuario');
    const inputPassword = document.getElementById('input-password');
    const btnLogin = document.getElementById('btn-login');
    const errorLogin = document.getElementById('error-login');
    const btnLogout = document.getElementById('btn-logout');
    const chatBox = document.getElementById('chat-box');
    const inputMensaje = document.getElementById('input-mensaje');
    const btnEnviar = document.getElementById('btn-enviar');
    const textoContador = document.getElementById('texto-contador');

    // Login
    btnLogin.addEventListener('click', async () => {
      const usuario = inputUsuario.value.trim();
      const password = inputPassword.value.trim();

      if (!usuario || !password) {
        errorLogin.textContent = 'Por favor completa todos los campos.';
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Verificando...';
      errorLogin.textContent = '';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password })
        });

        if (!res.ok) {
          errorLogin.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }

        const data = await res.json();
        iniciarSesion(data);

      } catch (e) {
        errorLogin.textContent = 'Error de conexión. Intenta nuevamente.';
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar';
      }
    });

    inputPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });

    function iniciarSesion(data) {
      sesion = data;
      historial = [];
      contadorPreguntas = 0;

      // Banner de bienvenida
      document.getElementById('nombre-paciente').textContent = data.nombre;
      document.getElementById('detalle-plan').textContent = `ID: ${data.paciente_id}`;

      const badge = document.getElementById('badge-plan');
      badge.textContent = data.plan;
      badge.className = `badge-plan ${data.plan}`;

      // El estado de póliza lo mostramos desde el login pero
      // el agente lo confirmará en el chat
      const estadoEl = document.getElementById('estado-poliza');
      estadoEl.textContent = data.vigente ? 'Póliza vigente' : 'Póliza vencida';
      estadoEl.className = data.vigente ? 'estado-poliza vigente' : 'estado-poliza vencida';

      // Mensaje de bienvenida en el chat
      const nombreCorto = data.nombre.split(' ')[0];
      const msgBienvenida = document.getElementById('msg-bienvenida');
      msgBienvenida.remove();
      agregarMensaje(data.bienvenida, 'agente');

      actualizarContador();

      pantalla_login.style.display = 'none';
      pantalla_chat.style.display = 'flex';
      inputMensaje.focus();
    }

    // Logout
    btnLogout.addEventListener('click', () => {
      sesion = null;
      historial = [];
      contadorPreguntas = 0;
      inputUsuario.value = '';
      inputPassword.value = '';
      errorLogin.textContent = '';
      chatBox.innerHTML = '<p class="mensaje-bienvenida-chat" id="msg-bienvenida"></p>';
      pantalla_chat.style.display = 'none';
      pantalla_login.style.display = 'flex';
    });

    // Contador
    function actualizarContador() {
      const restantes = LIMITE_PREGUNTAS - contadorPreguntas;
      textoContador.textContent = `${contadorPreguntas} / ${LIMITE_PREGUNTAS} preguntas usadas`;
      textoContador.className = restantes <= 3 ? 'advertencia' : '';
    }

    // Chat
    function agregarMensaje(texto, tipo) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('mensaje', tipo);

      const nombre = document.createElement('span');
      nombre.classList.add('nombre-remitente');
      nombre.textContent = tipo === 'usuario' ? 'Tú' : 'Asistente';

      const burbuja = document.createElement('div');
      burbuja.classList.add('burbuja');
      burbuja.innerHTML = texto
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^\d+\.\s(.+)/gm, '<p style="margin:4px 0">$&</p>')
        .replace(/\n/g, '<br>');

      wrapper.appendChild(nombre);
      wrapper.appendChild(burbuja);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function mostrarEscribiendo() {
      const wrapper = document.createElement('div');
      wrapper.classList.add('mensaje', 'agente', 'escribiendo');
      wrapper.id = 'escribiendo';
      const burbuja = document.createElement('div');
      burbuja.classList.add('burbuja');
      burbuja.textContent = 'Consultando tu cobertura...';
      wrapper.appendChild(burbuja);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function quitarEscribiendo() {
      const el = document.getElementById('escribiendo');
      if (el) el.remove();
    }

    async function enviarMensaje() {
      if (!sesion) return;
      const texto = inputMensaje.value.trim();
      if (!texto) return;

      if (contadorPreguntas >= LIMITE_PREGUNTAS) {
        agregarMensaje('Has alcanzado el límite de preguntas de esta sesión. Por favor cierra sesión e ingresa nuevamente.', 'agente');
        return;
      }

      agregarMensaje(texto, 'usuario');
      historial.push({ role: 'user', content: texto });

      inputMensaje.value = '';
      btnEnviar.disabled = true;
      mostrarEscribiendo();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mensaje: texto,
            paciente_id: sesion.paciente_id,
            historial: historial.slice(0, -1).slice(-28)
          })
        });

        const data = await res.json();
        quitarEscribiendo();

        agregarMensaje(data.respuesta, 'agente');
        historial.push({ role: 'assistant', content: data.respuesta });

        contadorPreguntas++;
        actualizarContador();

      } catch (error) {
        quitarEscribiendo();
        agregarMensaje('Ocurrió un error al consultar. Intenta nuevamente.', 'agente');
      }

      btnEnviar.disabled = false;
      inputMensaje.focus();
    }

    btnEnviar.addEventListener('click', enviarMensaje);

    inputMensaje.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarMensaje();
      }
    });
  </script>

</body>
</html>
